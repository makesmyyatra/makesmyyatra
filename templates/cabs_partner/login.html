<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Login — Makes My Yatra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-emerald-700 flex items-center justify-center text-white shadow-lg shadow-emerald-500/30">
                    <i data-lucide="car" class="w-6 h-6"></i>
                </div>
                <div class="text-left">
                    <span class="text-xl font-black text-white block">MAKES<span class="text-emerald-400">MY</span>YATRA</span>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Cab Partner Portal</span>
                </div>
            </div>
            <h1 class="text-2xl font-black text-white">Partner Login</h1>
            <p class="text-sm text-slate-400 mt-1">Access your cab duties & wallet</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            {% if messages %}
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-xl text-xs font-bold {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200{% else %}bg-emerald-50 text-emerald-800 border border-emerald-200{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-black text-slate-700 uppercase tracking-wider mb-2">Phone Number</label>
                    <div class="relative">
                        <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-4 top-3.5"></i>
                        <input type="tel" name="phone" required placeholder="e.g. 9876543210" pattern="[0-9]{10,15}" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm font-medium outline-none focus:ring-2 focus:ring-emerald-500 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-700 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-4 top-3.5"></i>
                        <input type="password" name="password" required placeholder="Enter your password" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-11 pr-4 py-3 text-sm font-medium outline-none focus:ring-2 focus:ring-emerald-500 transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white font-black text-sm uppercase tracking-wider py-3.5 rounded-xl shadow-lg shadow-emerald-500/30 transition">
                    Login to Dashboard
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
                <p>New partner? Contact admin to get your credentials.</p>
                <a href="{% url 'index' %}" class="inline-flex items-center gap-1 mt-3 text-emerald-600 hover:underline font-bold">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Website
                </a>
            </div>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
