{% extends 'custom_admin/base.html' %}
{% block title %}Add Partner{% endblock %}
{% block page_title %}Add Cab Partner{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <form method="POST" class="bg-white rounded-2xl border border-slate-200 p-6 space-y-5">
    {% csrf_token %}
    
    <h3 class="text-sm font-black uppercase text-slate-500 border-b pb-3">Partner Details</h3>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div><label class="block text-xs font-bold mb-1">Name *</label>
        <input type="text" name="name" required class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500"></div>
      
      <div><label class="block text-xs font-bold mb-1">Phone *</label>
        <input type="tel" name="phone" required class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500"></div>
      
      <div><label class="block text-xs font-bold mb-1">Email</label>
        <input type="email" name="email" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm outline-none"></div>
      
      <div><label class="block text-xs font-bold mb-1">Partner Type</label>
        <select name="partner_type" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm">
          <option value="INDIVIDUAL">Individual Driver</option>
          <option value="VENDOR">Cab Vendor/Agency</option>
        </select></div>
      
      <div><label class="block text-xs font-bold mb-1">City</label>
        <input type="text" name="city" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm"></div>
      
      <div><label class="block text-xs font-bold mb-1">Driving License No.</label>
        <input type="text" name="driving_license" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm"></div>
      
      <div class="sm:col-span-2"><label class="block text-xs font-bold mb-1">Address</label>
        <textarea name="address" rows="2" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm"></textarea></div>
    </div>
    
    <h3 class="text-sm font-black uppercase text-slate-500 border-b pb-3 pt-3">Commission & Wallet</h3>
    
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-xs font-bold mb-1">Commission %</label>
        <input type="number" step="0.01" name="commission_percentage" value="10" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm"></div>
      
      <div><label class="block text-xs font-bold mb-1">Min Wallet (₹)</label>
        <input type="number" step="0.01" name="min_wallet_required" value="500" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm"></div>
    </div>
    
    <div class="flex justify-end gap-3 pt-3">
      <a href="{% url 'portal_partners' %}" class="px-5 py-3 rounded-xl border text-xs font-bold">Cancel</a>
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs uppercase px-8 py-3 rounded-xl shadow">Add Partner</button>
    </div>
  </form>
</div>
{% endblock %}
