{% extends 'custom_admin/base.html' %}
{% block title %}Recharge — {{ partner.name }}{% endblock %}
{% block page_title %}Recharge Wallet{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-2xl border p-6 space-y-4">
    <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
      <p class="text-xs font-bold text-emerald-700 uppercase">Partner</p>
      <p class="font-black text-lg">{{ partner.name }}</p>
      <p class="text-sm text-slate-600">Current Balance: <b>₹{{ partner.wallet_balance }}</b></p>
    </div>

    <form method="POST" class="space-y-3">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold mb-1">Recharge Amount (₹) *</label>
        <input type="number" step="0.01" name="amount" required placeholder="e.g. 2000" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-lg font-black outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-bold mb-1">Reference (UPI/Bank Txn ID)</label>
        <input type="text" name="reference_id" placeholder="e.g. UPI-ABC123XYZ" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold mb-1">Notes</label>
        <textarea name="notes" rows="2" placeholder="Optional notes" class="w-full bg-slate-50 border rounded-xl px-4 py-3 text-sm"></textarea>
      </div>
      
      <div class="flex gap-3 pt-2">
        <a href="{% url 'portal_partner_detail' partner.id %}" class="flex-1 text-center px-5 py-3 rounded-xl border text-xs font-bold">Cancel</a>
        <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs uppercase py-3 rounded-xl">Add ₹</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
