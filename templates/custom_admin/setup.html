<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakeMyYatra Admin Setup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf8f5] flex items-center justify-center min-h-screen px-4 font-sans text-[#1a2e22]">

  <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-[#e2d9cc]">
    <div class="text-center mb-6">
      <div class="h-12 w-12 rounded-2xl bg-[#0f2e24] text-[#c5a880] flex items-center justify-center mx-auto mb-3 text-lg font-bold">
        MY
      </div>
      <h2 class="text-2xl font-serif font-bold text-[#0f2e24]">MAKES MY YATRA</h2>
      <p class="text-xs text-[#64748b] mt-1 uppercase tracking-widest font-semibold">1-Time Founder Setup</p>
    </div>

    <p class="text-xs text-[#64748b] mb-4 text-center">Apna pehla Primary Administrator account yahan create kijiye:</p>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-[#0f2e24] mb-1">Your Full Name</label>
        <input type="text" name="name" required class="w-full px-4 py-2.5 rounded-xl border border-[#e2d9cc] text-sm bg-[#faf8f5] outline-none" placeholder="e.g. Anchal Sharma">
      </div>
      <div>
        <label class="block text-xs font-bold text-[#0f2e24] mb-1">Email Address</label>
        <input type="email" name="email" required class="w-full px-4 py-2.5 rounded-xl border border-[#e2d9cc] text-sm bg-[#faf8f5] outline-none" placeholder="admin@makemyyatra.com">
      </div>
      <div>
        <label class="block text-xs font-bold text-[#0f2e24] mb-1">Choose Username</label>
        <input type="text" name="username" required class="w-full px-4 py-2.5 rounded-xl border border-[#e2d9cc] text-sm bg-[#faf8f5] outline-none" placeholder="e.g. anchal">
      </div>
      <div>
        <label class="block text-xs font-bold text-[#0f2e24] mb-1">Set Password</label>
        <input type="password" name="password" required class="w-full px-4 py-2.5 rounded-xl border border-[#e2d9cc] text-sm bg-[#faf8f5] outline-none" placeholder="••••••••">
      </div>
      <button type="submit" class="w-full py-3 bg-[#0f2e24] text-white font-bold rounded-xl text-sm transition hover:opacity-95 shadow">
        Create Super Admin & Launch 🚀
      </button>
    </form>
  </div>
</body>
</html>
