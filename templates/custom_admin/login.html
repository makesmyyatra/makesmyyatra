<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | MakesMyYatra</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

  <div class="max-w-md w-full space-y-6">
    
    <!-- Branding Logo Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white shadow-xl shadow-blue-500/25 mb-1">
        <i data-lucide="compass" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">MAKES<span class="text-blue-600">MY</span>YATRA</h1>
      <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Operations & Fleet Portal</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl shadow-slate-200/50 space-y-6">
      
      <div>
        <h2 class="text-base font-black text-slate-900">Sign In to Console</h2>
        <p class="text-xs text-slate-500 mt-0.5">Enter authorized staff credentials to continue.</p>
      </div>

      <!-- Flash Messages -->
      {% if messages %}
        <div class="space-y-2">
          {% for message in messages %}
            <div class="p-3.5 rounded-2xl text-xs font-bold flex items-center justify-between border {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border-rose-200{% else %}bg-blue-50 text-blue-800 border-blue-200{% endif %}">
              <span>{{ message }}</span>
              <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
      <!-- Login Form -->
      <form method="POST" action="{% url 'portal_login' %}" class="space-y-4">
        {% csrf_token %}
        <!-- Username -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Username</label>
          <div class="relative">
            <span class="absolute left-3.5 top-3 text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </span>
            <input type="text" 
                   name="username" 
                   required 
                   placeholder="Admin username" 
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-xs font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
          </div>
        </div>
        <!-- Password -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute left-3.5 top-3 text-slate-400">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </span>
            <input type="password" 
                   name="password" 
                   required 
                   placeholder="••••••••" 
                   class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-xs font-semibold text-slate-800 outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
          </div>
        </div>
        <!-- Submit Button -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-wider py-3 rounded-xl shadow-lg shadow-blue-500/25 transition flex items-center justify-center gap-2 cursor-pointer mt-2">
          <span>Authorize & Enter</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
      <!-- Bottom Help Note -->
      <div class="pt-4 border-t border-slate-100 text-center">
        <a href="{% url 'index' %}" class="text-[11px] font-bold text-slate-400 hover:text-blue-600 transition flex items-center justify-center gap-1">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Back to MakesMyYatra Home</span>
        </a>
      </div>
    </div>
  </div>
  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
