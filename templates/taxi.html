<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outstation Cabs | MakesMyYatra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #051322; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">

  <div class="max-w-md w-full text-center bg-slate-900/90 border border-slate-800 p-8 rounded-3xl shadow-2xl backdrop-blur-md">
    <div class="w-16 h-16 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <i data-lucide="car" class="w-8 h-8"></i>
    </div>
    <span class="text-[10px] font-black uppercase tracking-widest text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">Phase 2 Service</span>
    <h2 class="text-2xl font-black mt-3">Mountain Cabs Coming Soon</h2>
    <p class="text-xs text-slate-400 mt-2 leading-relaxed">
      We are partnering with verified local taxi unions across Himachal Pradesh. Chauffeur-driven outstation cabs will go live shortly.
    </p>

    <div class="mt-6 pt-6 border-t border-slate-800 flex flex-col gap-2.5">
      <a href="{% url 'index' %}" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 rounded-xl transition">
        Browse & Book Stays Instead
      </a>
      <a href="{% url 'support_request' %}" class="text-xs text-slate-400 hover:text-white transition">
        Need urgent travel help? Contact Desk →
      </a>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
