<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Partner Portal Login | MakesMyYatra</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#faf8f5] flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">
  <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-[#e2d9cc] shadow-xl">
    <div class="text-center mb-6">
      <span class="text-[11px] font-bold uppercase tracking-wider text-[#c5a880] bg-[#0f2e24]/5 px-3 py-1 rounded-full">Hotelier Desk</span>
      <h2 class="text-2xl font-serif font-black text-[#0f2e24] mt-2">Partner Portal</h2>
      <p class="text-xs text-slate-500 mt-1">Sign in to manage your property reservations</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <p class="p-3 mb-4 rounded-xl text-xs bg-rose-50 text-rose-700 border border-rose-200 font-semibold text-center">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Partner Username</label>
        <input type="text" name="username" required placeholder="Enter username" class="w-full bg-[#faf8f5] border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold outline-none focus:ring-2 focus:ring-[#0f2e24]">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full bg-[#faf8f5] border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold outline-none focus:ring-2 focus:ring-[#0f2e24]">
      </div>
      <button type="submit" class="w-full py-3.5 bg-[#0f2e24] hover:bg-[#164234] text-white font-bold text-xs uppercase tracking-wider rounded-xl transition shadow">
        Access Property Dashboard
      </button>
    </form>
    <div class="mt-6 text-center">
      <a href="{% url 'index' %}" class="text-[11px] font-bold text-slate-400 hover:text-[#0f2e24]">← Back to MakesMyYatra</a>
    </div>
  </div>
</body>
</html>
