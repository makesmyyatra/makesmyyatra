<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Login - MakesMyYatra</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between font-sans">

  <!-- Top Simple Header -->
  <header class="bg-white border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="{% url 'index' %}" class="text-xl font-bold text-gray-900 tracking-tight">
        Makes<span class="text-blue-600">MyYatra</span>
        <span class="text-xs ml-2 font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-100">Partner</span>
      </a>
      <a href="{% url 'index' %}" class="text-sm font-medium text-gray-600 hover:text-blue-600">
        Back to Home
      </a>
    </div>
  </header>

  <!-- Login Card -->
  <main class="w-full max-w-md mx-auto px-4 py-12">
    <div class="bg-white border border-gray-200 rounded-xl p-8 shadow-sm">
      
      <!-- Heading -->
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Partner Login</h1>
        <p class="text-sm text-gray-500 mt-1">Sign in to manage your stays and bookings</p>
      </div>

      <!-- Messages -->
      {% if messages %}
        <div class="mb-5 space-y-2">
          {% for message in messages %}
            <div class="p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" action="{% url 'partner_login' %}" class="space-y-4">
        {% csrf_token %}

        <!-- Username or Email -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Username or Email</label>
          <input type="text" name="username" required placeholder="Enter username or email"
            class="w-full px-3.5 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
          <input type="password" name="password" required placeholder="Enter your password"
            class="w-full px-3.5 py-2.5 bg-white border border-gray-300 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600">
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg transition duration-150">
          Sign In
        </button>
      </form>

      <!-- Footer Link inside Card -->
      <div class="mt-6 pt-5 border-t border-gray-100 text-center text-sm text-gray-600">
        Don't have a partner account? 
        <a href="{% url 'partner_register' %}" class="text-blue-600 font-semibold hover:underline">
          Register here
        </a>
      </div>

    </div>
  </main>

  <!-- Simple Footer -->
  <footer class="py-6 text-center text-xs text-gray-500 border-t border-gray-200 bg-white">
    © 2026 MakesMyYatra Partner Network. All rights reserved.
  </footer>

</body>
</html>
